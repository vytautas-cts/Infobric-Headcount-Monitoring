name: Deploy Python Azure Function

on:
  push:
    branches:
      - azure-function
  workflow_dispatch:


env:
  PYTHON_VERSION: '3.11'


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"


    - name: Verify files
      run: |
        ls -la
        ls -la .python_packages/lib/site-packages


    - name: Create package
      run: |
        zip -r release.zip . \
        -x "*.git*" \
        -x ".venv/*"


    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: function-package
        path: release.zip



  deploy:

    runs-on: ubuntu-latest

    needs: build


    steps:

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: function-package


    - name: Extract
      run: unzip release.zip


    - name: Deploy Function App
      uses: Azure/functions-action@v1
      with:
        app-name: infobric-headcount-monitor
        package: .
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A95301DC4A2C4B2C82E688110C3F95DB }}